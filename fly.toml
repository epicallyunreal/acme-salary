# fly.toml app configuration file generated for acme-salary on 2026-10-07T04:09:53+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'acme-salary'
primary_region = 'sin'

[build]

[env]
  PORT = '8000'

[mounts]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '300s'
    interval = '30s'
    method = 'GET'
    timeout = '10s'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
