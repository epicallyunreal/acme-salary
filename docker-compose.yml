# Local parity with the Fly deployment: one container, SQLite on a named volume.
# SECRET_KEY and SEED_ADMIN_PASSWORD come from backend/.env (copy backend/.env.example).
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: backend/.env
        required: false
    environment:
      DEBUG: "0"
      # Nothing proxies gunicorn here, so no X-Forwarded-For hop is trusted (D73).
      NUM_PROXIES: "0"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:8000
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      DATABASE_PATH: /data/db.sqlite3
      SPA_DIR: /app/spa
      PORT: "8000"
    volumes:
      - acme-data:/data

volumes:
  acme-data:
